<text x="593.0" y="76.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#777777" font-weight="normal">one group = 64 rows (4 × VL)</text>
<text x="593.0" y="90.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#777777" font-weight="normal">V7 is flat from M=1 to M=64: a partial</text>
<text x="593.0" y="103.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#777777" font-weight="normal">group costs the same as a full one</text>
<text x="90.0" y="346.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#777777" font-weight="normal">A 9 ns SMSTART cannot explain a 6 µs plateau; the group can, exactly.</text>
