<text x="78.0" y="26.0" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="start" fill="#222222" font-weight="bold">When does the SME kernel beat the scalar reference?</text>
<text x="78.0" y="43.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#777777" font-weight="normal">Crossover at M≈16 — but the cause is group granularity, not streaming-mode overhead.</text>
