<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300">
<rect width="780" height="300" fill="white"/>
<text x="150.0" y="26.0" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="start" fill="#222222" font-weight="bold">Why RMSNorm is faster: one fewer reduction stage</text>
<text x="150.0" y="43.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#777777" font-weight="normal">Reduction stages and input traversals — the terms 'two-pass' and 'single-pass' conflate these.</text>
<line x1="150.0" y1="246.0" x2="754.0" y2="246.0" stroke="#333333" stroke-width="1.0"/>
<line x1="150.0" y1="64.0" x2="150.0" y2="246.0" stroke="#333333" stroke-width="1.0"/>
<text x="452.0" y="284.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle" fill="#222222" font-weight="normal"></text>
<text x="18" y="155.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" text-anchor="middle" fill="#222222" transform="rotate(-90 18 155.0)"></text>
<text x="136.0" y="98.0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="end" fill="#222222" font-weight="bold">RMSNorm</text>
<rect x="150.0" y="82.0" width="164.0" height="30.0" fill="#1f77b4" opacity="0.85"/>
<text x="232.0" y="101.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="white" font-weight="normal">read x → Σx²</text>
<rect x="322.0" y="82.0" width="164.0" height="30.0" fill="#1f77b4" opacity="0.85"/>
<text x="404.0" y="101.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="white" font-weight="normal">read x → normalise, scale γ, write y</text>
<text x="498.0" y="101.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#777777" font-weight="normal">2 traversals · 2R+1W</text>
<text x="136.0" y="172.0" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="end" fill="#222222" font-weight="bold">LayerNorm</text>
<rect x="150.0" y="156.0" width="164.0" height="30.0" fill="#d62728" opacity="0.85"/>
<text x="232.0" y="175.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="white" font-weight="normal">read x → mean</text>
<rect x="322.0" y="156.0" width="164.0" height="30.0" fill="#d62728" opacity="0.85"/>
<text x="404.0" y="175.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="white" font-weight="normal">read x → variance (centred)</text>
<rect x="494.0" y="156.0" width="164.0" height="30.0" fill="#d62728" opacity="0.85"/>
<text x="576.0" y="175.0" font-family="Helvetica,Arial,sans-serif" font-size="9.5" text-anchor="middle" fill="white" font-weight="normal">read x → normalise, scale γ, shift β, write y</text>
<text x="670.0" y="175.0" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#777777" font-weight="normal">3 traversals · 3R+1W</text>
<text x="136.0" y="234.0" font-family="Helvetica,Arial,sans-serif" font-size="12" text-anchor="end" fill="#777777" font-weight="normal">ratio</text>
<text x="150.0" y="234.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#222222" font-weight="normal">3R+1W ÷ 2R+1W = 1.33× more traffic per element for LayerNorm — the structural source of the gap.</text>
</svg>
