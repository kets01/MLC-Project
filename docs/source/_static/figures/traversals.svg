<svg xmlns="http://www.w3.org/2000/svg" width="840" height="330" viewBox="0 0 840 330">
<rect width="840" height="330" fill="white"/>
<text x="46.0" y="28.0" font-family="Inter,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17" text-anchor="start" fill="#1a1a1a" font-weight="700">Why RMSNorm is faster: one fewer reduction stage</text>
<text x="46.0" y="46.0" font-family="Inter,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">“Two-pass” and “single-pass” name the reduction stages; what costs bandwidth is the number of input traversals.</text>
<text x="118.0" y="90.0" font-family="Inter,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" text-anchor="end" fill="#1a1a1a" font-weight="700">RMSNorm</text>
<rect x="132.0" y="70.0" width="92.7" height="32.0" rx="4" fill="#0072B2" opacity="1.0"/>
<text x="178.3" y="91.0" font-family="Inter,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="white" font-weight="600">read x → Σx²</text>
<rect x="234.7" y="70.0" width="186.7" height="32.0" rx="4" fill="#0072B2" opacity="1.0"/>
<text x="328.0" y="91.0" font-family="Inter,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="white" font-weight="600">read x → normalise · γ → write y</text>
<text x="435.4" y="91.0" font-family="Inter,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#6b7280" font-weight="400">2 traversals · 2R+1W</text>
<text x="118.0" y="152.0" font-family="Inter,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" text-anchor="end" fill="#1a1a1a" font-weight="700">LayerNorm</text>
<rect x="132.0" y="132.0" width="101.2" height="32.0" rx="4" fill="#D55E00" opacity="1.0"/>
<text x="182.6" y="153.0" font-family="Inter,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="white" font-weight="600">read x → mean</text>
<rect x="243.2" y="132.0" width="167.6" height="32.0" rx="4" fill="#D55E00" opacity="1.0"/>
<text x="327.0" y="153.0" font-family="Inter,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="white" font-weight="600">read x → variance (centred)</text>
<rect x="420.8" y="132.0" width="203.3" height="32.0" rx="4" fill="#D55E00" opacity="1.0"/>
<text x="522.4" y="153.0" font-family="Inter,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle" fill="white" font-weight="600">read x → normalise · γ · β → write y</text>
<text x="638.1" y="153.0" font-family="Inter,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#6b7280" font-weight="400">3 traversals · 3R+1W</text>
<text x="118.0" y="214.0" font-family="Inter,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="end" fill="#6b7280" font-weight="400">traffic</text>
<rect x="132.0" y="200.0" width="42.0" height="18.0" rx="3" fill="#0072B2" opacity="0.35"/>
<rect x="178.0" y="200.0" width="42.0" height="18.0" rx="3" fill="#0072B2" opacity="0.35"/>
<rect x="224.0" y="200.0" width="42.0" height="18.0" rx="3" fill="#0072B2" opacity="0.85"/>
<text x="278.0" y="214.0" font-family="Inter,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="400">R R W   =  3 units</text>
<rect x="132.0" y="226.0" width="42.0" height="18.0" rx="3" fill="#D55E00" opacity="0.35"/>
<rect x="178.0" y="226.0" width="42.0" height="18.0" rx="3" fill="#D55E00" opacity="0.35"/>
<rect x="224.0" y="226.0" width="42.0" height="18.0" rx="3" fill="#D55E00" opacity="0.35"/>
<rect x="270.0" y="226.0" width="42.0" height="18.0" rx="3" fill="#D55E00" opacity="0.85"/>
<text x="324.0" y="240.0" font-family="Inter,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="400">R R R W   =  4 units</text>
<text x="132.0" y="274.0" font-family="Inter,Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#1a1a1a" font-weight="600">4 ÷ 3 = 1.33× more traffic per element for LayerNorm — the structural source of the gap.</text>
</svg>
