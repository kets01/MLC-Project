<svg xmlns="http://www.w3.org/2000/svg" width="780" height="450" viewBox="0 0 780 450">
<rect width="780" height="450" fill="white"/>
<text x="78.0" y="26.0" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="start" fill="#222222" font-weight="bold">Bandwidth ceiling depends on working-set size</text>
<text x="78.0" y="43.0" font-family="Helvetica,Arial,sans-serif" font-size="11.5" text-anchor="start" fill="#777777" font-weight="normal">Apple M4, single core. Dividing a cache-resident kernel by the DRAM ceiling inflates its % of peak ~2x.</text>
