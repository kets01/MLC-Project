<text x="112.0" y="398.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" text-anchor="start" fill="#777777" font-weight="normal">Note the inversion: our RMSNorm beats our LayerNorm; PyTorch's LayerNorm beats its RMSNorm —</text>
